name: Données (classement Botola + logos)

on:
  schedule:
    - cron: '17 */6 * * *'   # toutes les 6 heures
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Classement Botola (Wikipédia)
        run: node .github/scripts/botola.mjs
        continue-on-error: true
      - name: Logos des équipes (TheSportsDB)
        run: node .github/scripts/logos.mjs
        continue-on-error: true
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain botola.json logos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add botola.json logos.json
            git commit -m "Données mises à jour (classement Botola / logos)"
            git pull --rebase --quiet
            git push
          else
            echo "Pas de changement"
          fi
